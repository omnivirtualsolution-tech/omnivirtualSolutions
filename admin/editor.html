<!DOCTYPE html>
<html lang="en">

<head>
  <base href="/">
  <meta charset="utf-8">
  <script>
    (function () {
      try {
        var token = localStorage.getItem('omni_admin_token');
        if (!token) {
          if (window.top !== window.self) window.top.location.replace('admin/login.html');
          else window.location.replace('admin/login.html');
          return;
        }
        var parts = token.split('.');
        if (parts.length !== 3) throw new Error();
        var payload = JSON.parse(atob(parts[1]));
        if (!payload.exp || (payload.exp * 1000) <= Date.now()) {
          throw new Error('Expired');
        }
      } catch (_) {
        localStorage.removeItem('omni_admin_token');
        localStorage.removeItem('omni_admin_user');
        if (window.top !== window.self) window.top.location.replace('admin/login.html');
        else window.location.replace('admin/login.html');
      }
    })();
  </script>
  <meta content="width=device-width, initial-scale=1.0" name="viewport">
  <title>Omni CMS — Live Website Editor</title>
  <link rel="icon" type="image/png" href="assets/img/OmniLogo2.png">

  <!-- Favicons -->
  <link href="assets/img/apple-touch-icon.png" rel="apple-touch-icon">

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com" rel="preconnect">
  <link href="https://fonts.gstatic.com" rel="preconnect" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">

  <!-- Vendor CSS Files -->
  <link href="assets/vendor/bootstrap/css/bootstrap.min.css" rel="stylesheet">
  <link href="assets/vendor/bootstrap-icons/bootstrap-icons.css" rel="stylesheet">

  <!-- ── In-Place CMS Live Editor Styles ── -->
  <style>
    /* ── Instant Auth Shield: prevent flash of editor ── */
    html {
      visibility: hidden;
      opacity: 0;
      background: #0b0e14;
    }
    html.auth-ready {
      visibility: visible;
      opacity: 1;
      transition: opacity 0.12s ease-in;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0b0e14;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    /* Top Floating Admin Toolbar */
    #editorTopBar {
      position: relative;
      height: 52px;
      background: rgba(14, 18, 23, 0.96);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid rgba(235, 162, 45, 0.35);
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      color: #f7f3ee;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
    }
    .editor-bar-left, .editor-bar-right, .editor-bar-center {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .editor-brand {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      font-weight: 700;
      color: #eba22d;
      background: rgba(235, 162, 45, 0.12);
      border: 1px solid rgba(235, 162, 45, 0.25);
      padding: 4px 10px;
      border-radius: 6px;
      text-decoration: none;
    }
    .editor-brand:hover {
      color: #ffd074;
      background: rgba(235, 162, 45, 0.2);
    }
    .editor-live-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      font-weight: 600;
      color: #48bb78;
      background: rgba(72, 187, 120, 0.12);
      border: 1px solid rgba(72, 187, 120, 0.25);
      padding: 3px 8px;
      border-radius: 20px;
    }
    .editor-live-badge .dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: #48bb78;
      box-shadow: 0 0 8px #48bb78;
      animation: editorPulse 1.8s infinite;
    }
    @keyframes editorPulse {
      0% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.85); }
      100% { opacity: 1; transform: scale(1); }
    }
    .editor-save-status {
      font-size: 12px;
      color: #a0aec0;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .editor-save-status.saving { color: #eba22d; }
    .editor-save-status.saved { color: #48bb78; }

    .editor-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      font-weight: 600;
      padding: 5px 12px;
      border-radius: 6px;
      border: 1px solid rgba(255, 255, 255, 0.14);
      background: rgba(255, 255, 255, 0.06);
      color: #e2e8f0;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.2s ease;
    }
    .editor-btn:hover {
      background: rgba(255, 255, 255, 0.12);
      border-color: rgba(235, 162, 45, 0.5);
      color: #ffffff;
    }
    .editor-btn.active {
      background: #eba22d;
      color: #0d1117;
      border-color: #eba22d;
    }

    /* Live Website Iframe (Single Source of Truth) */
    #editorIframe {
      width: 100%;
      height: calc(100vh - 52px);
      border: none;
      display: block;
      background: #ffffff;
    }

    /* When embedded inside iframe in admin/index.html */
    html.in-iframe #editorTopBar {
      display: none !important;
    }
    html.in-iframe #editorIframe {
      height: 100vh !important;
    }

    /* Toast */
    #editorToast {
      position: fixed;
      bottom: 20px; right: 20px;
      background: #141922;
      border: 1px solid rgba(235, 162, 45, 0.4);
      color: #ffffff;
      padding: 10px 16px;
      border-radius: 8px;
      font-size: 13px;
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
      z-index: 999999;
      transform: translateY(100px);
      opacity: 0;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    #editorToast.show { transform: translateY(0); opacity: 1; }

    /* Media Modal */
    #mediaModal {
      position: fixed;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%) scale(0.95);
      width: min(640px, 92vw);
      max-height: 85vh;
      background: #12161f;
      border: 1px solid rgba(235, 162, 45, 0.35);
      border-radius: 12px;
      z-index: 999999;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.85);
      display: none;
      flex-direction: column;
      overflow: hidden;
      transition: all 0.25s ease;
    }
    #mediaModal.show { display: flex; transform: translate(-50%, -50%) scale(1); }
    .modal-backdrop-custom {
      position: fixed; inset: 0;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(4px);
      z-index: 999998;
      display: none;
    }
    .modal-backdrop-custom.show { display: block; }
    .media-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
      gap: 12px;
      max-height: 380px;
      overflow-y: auto;
      padding: 16px;
    }
    .media-thumb {
      aspect-ratio: 4/3;
      object-fit: cover;
      width: 100%;
      border-radius: 6px;
      border: 2px solid transparent;
      cursor: pointer;
      transition: all 0.2s;
    }
    .media-thumb:hover {
      border-color: #eba22d;
      transform: scale(1.04);
    }

    /* Icon Picker Modal */
    #iconPickerModal {
      position: fixed;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%) scale(0.95);
      width: 90%;
      max-width: 480px;
      background: #141923;
      border: 1px solid rgba(235, 162, 45, 0.4);
      border-radius: 14px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.85);
      z-index: 10001;
      opacity: 0;
      visibility: hidden;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }
    #iconPickerModal.show {
      opacity: 1;
      visibility: visible;
      transform: translate(-50%, -50%) scale(1);
    }
    .icon-opt {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 10px 4px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.06);
      cursor: pointer;
      color: #cbd5e1;
      transition: all 0.15s;
    }
    .icon-opt i {
      font-size: 20px;
      color: #eba22d;
    }
    .icon-opt span {
      font-size: 10px;
      color: #94a3b8;
      max-width: 60px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .icon-opt:hover {
      background: rgba(235, 162, 45, 0.15);
      border-color: rgba(235, 162, 45, 0.5);
      color: #fff;
      transform: translateY(-2px);
    }
  </style>
</head>

<body class="mode-edit">

  <!-- ── 1. Floating Top Bar ── -->
  <div id="editorTopBar">
    <div class="editor-bar-left">
      <a href="admin/" class="editor-brand" title="Back to Admin Dashboard">
        <i class="bi bi-arrow-left"></i> Dashboard
      </a>
      <span class="editor-live-badge">
        <span class="dot"></span> Live In-Place Editor
      </span>
      <div class="editor-save-status" id="editorSaveStatus">
        <i class="bi bi-check-circle-fill text-success"></i> All changes saved
      </div>
    </div>

    <div class="editor-bar-center">
      <button class="editor-btn active" id="btnEdit" onclick="setEditorMode(true)">
        <i class="bi bi-pencil-fill"></i> Edit Mode
      </button>
      <button class="editor-btn" id="btnPreview" onclick="setEditorMode(false)">
        <i class="bi bi-eye-fill"></i> Visitor Preview
      </button>
    </div>

    <div class="editor-bar-right">
      <button class="editor-btn" onclick="openMediaPicker()">
        <i class="bi bi-images"></i> Media Library
      </button>
      <a href="index.html" target="_blank" class="editor-btn">
        <i class="bi bi-box-arrow-up-right"></i> View Public Site
      </a>
    </div>
  </div>

  <!-- ── 2. The Real Website (Single Source of Truth) ── -->
  <iframe id="editorIframe" src="admin/site/index.html?edit=1" allow="clipboard-write" title="Omni Website Live Preview"></iframe>

  <!-- ── 3. Image Picker Modal ── -->
  <div class="modal-backdrop-custom" id="modalBackdrop" onclick="closeMediaPicker()"></div>
  <div id="mediaModal">
    <div style="padding: 16px 20px; border-bottom: 1px solid rgba(255,255,255,0.08); display:flex; justify-content:space-between; align-items:center; color:#fff;">
      <h4 style="margin:0; font-size:16px; font-weight:700; color:#eba22d;"><i class="bi bi-images me-2"></i> Media Library & Image Picker</h4>
      <button type="button" class="btn-close btn-close-white" onclick="closeMediaPicker()"></button>
    </div>
    <div style="padding: 14px 20px; border-bottom: 1px solid rgba(255,255,255,0.08); background: rgba(0,0,0,0.2);">
      <label class="editor-btn" style="cursor: pointer;">
        <i class="bi bi-cloud-arrow-up-fill"></i> Upload New Image
        <input type="file" id="mediaUploadInput" accept="image/*" style="display:none" onchange="uploadImage(this)">
      </label>
      <span style="font-size:12px; color:#a0aec0; margin-left: 10px;">Click an image below to update target photo</span>
    </div>
    <div class="media-grid" id="mediaGrid">
      <div style="color:#718096; padding: 20px;">Loading images...</div>
    </div>
  </div>

  <!-- ── 3b. Icon Picker Modal ── -->
  <div class="modal-backdrop-custom" id="iconPickerBackdrop" onclick="closeIconPicker()"></div>
  <div id="iconPickerModal">
    <div style="padding: 16px 20px; border-bottom: 1px solid rgba(255,255,255,0.08); display:flex; justify-content:space-between; align-items:center; color:#fff;">
      <h4 style="margin:0; font-size:16px; font-weight:700; color:#eba22d;"><i class="bi bi-palette-fill me-2"></i> Choose Highlight Icon</h4>
      <button type="button" class="btn-close btn-close-white" onclick="closeIconPicker()"></button>
    </div>
    <div style="padding: 12px 20px; border-bottom: 1px solid rgba(255,255,255,0.08); background: rgba(0,0,0,0.2);">
      <input type="text" id="iconSearchInput" placeholder="Filter icons (e.g. book, star, check, heart)..." oninput="filterIconGrid(this.value)" style="width:100%; background:#151a23; border:1px solid rgba(255,255,255,0.1); border-radius:8px; padding:8px 12px; color:#fff; font-size:13px; outline:none;">
    </div>
    <div class="icon-grid" id="iconGrid" style="display:grid; grid-template-columns:repeat(auto-fill, minmax(70px, 1fr)); gap:10px; padding:18px 20px; max-height:340px; overflow-y:auto;">
      <!-- Populated dynamically -->
    </div>
  </div>

  <!-- ── 4. Toast Notification ── -->
  <div id="editorToast">
    <i class="bi bi-check-circle-fill text-warning fs-5"></i>
    <span id="editorToastMsg">Saved successfully</span>
  </div>

  <!-- ── 5. Editor Shell Logic & Iframe Synchronization Bridge ── -->
  <script>
    (function () {
      'use strict';

      const token = localStorage.getItem('omni_admin_token');
      if (!token) {
        localStorage.removeItem('omni_admin_token');
        localStorage.removeItem('omni_admin_user');
        if (window.top !== window.self) {
          window.top.location.href = 'admin/login.html';
        } else {
          window.location.href = 'admin/login.html';
        }
        return;
      }

      let isEditMode = true;
      let targetImgKey = null;

      const saveStatus = document.getElementById('editorSaveStatus');
      const toast = document.getElementById('editorToast');
      const toastMsg = document.getElementById('editorToastMsg');
      const iframe = document.getElementById('editorIframe');

      function showToast(msg) {
        if (!toast || !toastMsg) return;
        toastMsg.textContent = msg;
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 2400);
      }

      function setSaving(saving) {
        if (saveStatus) {
          if (saving) {
            saveStatus.className = 'editor-save-status saving';
            saveStatus.innerHTML = '<span class="spinner-border spinner-border-sm me-1 text-warning"></span> Saving...';
          } else {
            saveStatus.className = 'editor-save-status saved';
            saveStatus.innerHTML = '<i class="bi bi-check-circle-fill text-success"></i> All changes saved';
          }
        }
        if (window.parent && window.parent !== window) {
          try {
            window.parent.postMessage({ type: 'CMS_STATUS', saving: saving }, '*');
          } catch (_) {}
        }
      }

      // Detect if embedded inside admin dashboard iframe
      if (window.self !== window.top) {
        document.documentElement.classList.add('in-iframe');
      }

      // Master Edit Mode Switcher
      window.setEditorMode = function (edit) {
        isEditMode = Boolean(edit);
        document.body.classList.toggle('mode-edit', isEditMode);
        document.body.classList.toggle('mode-preview', !isEditMode);

        const btnEdit = document.getElementById('btnEdit');
        const btnPrev = document.getElementById('btnPreview');
        if (btnEdit) btnEdit.classList.toggle('active', isEditMode);
        if (btnPrev) btnPrev.classList.toggle('active', !isEditMode);

        // Sync mode to iframe
        if (iframe && iframe.contentWindow) {
          iframe.contentWindow.postMessage({ type: 'SET_MODE', edit: isEditMode }, '*');
          try {
            if (typeof iframe.contentWindow.__omniSetEditMode === 'function') {
              iframe.contentWindow.__omniSetEditMode(isEditMode);
            }
          } catch (_) {}
        }
        showToast(isEditMode ? 'Edit Mode active: click text, icon or photo to edit' : 'Visitor Preview active');
      };

      // When the iframe finishes loading
      if (iframe) {
        iframe.addEventListener('load', function () {
          try {
            if (iframe.contentDocument && iframe.contentDocument.documentElement) {
              iframe.contentDocument.documentElement.classList.add('in-iframe');
            }
          } catch (_) {}
          // Push current mode to iframe
          if (iframe.contentWindow) {
            iframe.contentWindow.postMessage({ type: 'SET_MODE', edit: isEditMode }, '*');
            try {
              if (typeof iframe.contentWindow.__omniSetEditMode === 'function') {
                iframe.contentWindow.__omniSetEditMode(isEditMode);
              }
            } catch (_) {}
          }
        });
      }

      // Listen for messages from parent dashboard or inner iframe
      window.addEventListener('message', (e) => {
        if (e.origin && e.origin !== window.location.origin) return;
        if (!e.data) return;
        if (e.data.type === 'SET_MODE') {
          if (typeof window.setEditorMode === 'function') {
            window.setEditorMode(e.data.edit);
          }
        } else if (e.data.type === 'OPEN_MEDIA') {
          openMediaPicker(e.data.key || null);
        } else if (e.data.type === 'CMS_STATUS') {
          const isSaving = e.data.status === 'saving' || e.data.saving === true;
          setSaving(isSaving);
        }
      });

      // Save content block to backend database
      async function saveBlock(key, value) {
        setSaving(true);
        try {
          const res = await fetch(`/api/v1/cms/blocks/${encodeURIComponent(key)}`, {
            method: 'PATCH',
            headers: {
              'Content-Type': 'application/json',
              'Authorization': 'Bearer ' + token
            },
            body: JSON.stringify({ value })
          });
          if (res.status === 401) {
            localStorage.removeItem('omni_admin_token');
            localStorage.removeItem('omni_admin_user');
            if (window.top !== window.self) window.top.location.href = 'admin/login.html';
            else window.location.href = 'admin/login.html';
            return;
          }
          const data = await res.json();
          if (res.ok && data.success) {
            setSaving(false);
            showToast(`Saved: ${key}`);
          } else {
            throw new Error(data.error?.message || 'Save error');
          }
        } catch (e) {
          setSaving(false);
          alert('Save failed: ' + e.message);
        }
      }

      // ── Media Library Modal System ──
      window.openMediaPicker = function (key = null) {
        targetImgKey = key;
        document.getElementById('modalBackdrop').classList.add('show');
        document.getElementById('mediaModal').classList.add('show');
        loadMedia();
      };

      window.closeMediaPicker = function () {
        document.getElementById('modalBackdrop').classList.remove('show');
        document.getElementById('mediaModal').classList.remove('show');
        targetImgKey = null;
      };

      async function loadMedia() {
        const grid = document.getElementById('mediaGrid');
        try {
          const res = await fetch('/api/v1/site-meta');
          const data = await res.json();
          const assets = data.media_assets || [];
          const defaultImgs = [
            'assets/img/about_team.jpg',
            'assets/img/footer-image.jpg',
            'assets/img/OmniLogo2.png',
            'assets/img/books/book1.png',
            'assets/img/books/book2.png',
            'assets/img/books/book3.png',
            'assets/img/books/book4.png'
          ];
          const all = Array.from(new Set([...assets.map(a => a.file_path), ...defaultImgs]));

          grid.innerHTML = all.map(path => {
            const clean = path.startsWith('/') ? path.slice(1) : path;
            const filename = clean.split('/').pop();
            const isUploaded = clean.includes('upload_') || clean.includes('uploads/') || clean.includes('/media/');
            return `
              <div style="position:relative;">
                <img src="${clean}" class="media-thumb" onclick="pickImage('${clean}')" alt="Media asset">
                ${isUploaded ? `
                  <button type="button" 
                          onclick="deleteMediaFromTurso('${clean}', event)"
                          title="Delete permanently from Turso Cloud database"
                          style="position:absolute; top:4px; right:4px; background:rgba(239,68,68,0.9); color:#fff; border:none; border-radius:4px; width:22px; height:22px; font-size:11px; cursor:pointer; display:flex; align-items:center; justify-content:center; z-index:2;">
                    <i class="bi bi-trash3-fill"></i>
                  </button>
                ` : ''}
              </div>
            `;
          }).join('');
        } catch (e) {
          grid.innerHTML = '<div class="text-danger p-3">Failed to load media.</div>';
        }
      }

      window.deleteMediaFromTurso = async function (filePath, e) {
        if (e) {
          e.stopPropagation();
          e.preventDefault();
        }
        const filename = filePath.split('/').pop();
        if (!confirm(`Delete "${filename}" from Turso Cloud database?\n\nThis will permanently delete the binary data from Turso to conserve database storage.`)) return;

        try {
          const res = await fetch(`/api/v1/cms/media/${encodeURIComponent(filename)}`, {
            method: 'DELETE',
            headers: { 'Authorization': 'Bearer ' + token }
          });
          const data = await res.json();
          if (res.ok && data.success) {
            showToast('Deleted from Turso Cloud');
            loadMedia();
          } else {
            alert('Delete failed: ' + (data.error?.message || 'Error'));
          }
        } catch (err) {
          alert('Delete error: ' + err.message);
        }
      };

      window.pickImage = async function (path) {
        if (targetImgKey) {
          try {
            if (iframe && iframe.contentDocument) {
              iframe.contentDocument.querySelectorAll(`img[data-block-key="${targetImgKey}"]`).forEach(img => {
                img.src = path;
              });
            }
          } catch (_) {}
          await saveBlock(targetImgKey, path);
        }
        closeMediaPicker();
      };

      window.uploadImage = async function (input) {
        const file = input.files[0];
        if (!file) return;

        const formData = new FormData();
        formData.append('image', file);
        if (targetImgKey) formData.append('block_key', targetImgKey);

        showToast('Uploading image...');

        try {
          const res = await fetch('/api/v1/cms/upload', {
            method: 'POST',
            headers: { 'Authorization': 'Bearer ' + token },
            body: formData
          });
          if (res.status === 401) {
            localStorage.removeItem('omni_admin_token');
            localStorage.removeItem('omni_admin_user');
            if (window.top !== window.self) window.top.location.href = 'admin/login.html';
            else window.location.href = 'admin/login.html';
            return;
          }
          const data = await res.json();
          if (res.ok && data.success) {
            showToast('Uploaded!');
            if (targetImgKey) {
              try {
                if (iframe && iframe.contentDocument) {
                  iframe.contentDocument.querySelectorAll(`img[data-block-key="${targetImgKey}"]`).forEach(img => {
                    img.src = data.path;
                  });
                }
              } catch (_) {}
              await saveBlock(targetImgKey, data.path);
              closeMediaPicker();
            } else {
              loadMedia();
            }
          } else {
            alert('Upload error: ' + (data.error?.message || 'Failed'));
          }
        } catch (e) {
          alert('Upload failed: ' + e.message);
        }
      };

      // ── Icon Picker Modal System ──
      let activeIconPickerTagIndex = null;
      const AVAILABLE_ICONS = [
        { name: 'Book', icon: 'bi-book-half' },
        { name: 'Journal', icon: 'bi-journal-check' },
        { name: 'Megaphone', icon: 'bi-megaphone' },
        { name: 'Award', icon: 'bi-award' },
        { name: 'Shield', icon: 'bi-shield-check' },
        { name: 'Star', icon: 'bi-star-fill' },
        { name: 'Check', icon: 'bi-check-circle-fill' },
        { name: 'Gem', icon: 'bi-gem' },
        { name: 'Headphones', icon: 'bi-headphones' },
        { name: 'Pen', icon: 'bi-pen' },
        { name: 'Rocket', icon: 'bi-rocket-takeoff' },
        { name: 'Globe', icon: 'bi-globe' },
        { name: 'Heart', icon: 'bi-heart-fill' },
        { name: 'Sparkles', icon: 'bi-stars' },
        { name: 'Briefcase', icon: 'bi-briefcase-fill' },
        { name: 'Chat', icon: 'bi-chat-dots-fill' },
        { name: 'Graph', icon: 'bi-graph-up-arrow' },
        { name: 'Lightning', icon: 'bi-lightning-charge-fill' },
        { name: 'Files', icon: 'bi-file-earmark-text-fill' },
        { name: 'Palette', icon: 'bi-palette-fill' },
        { name: 'Box', icon: 'bi-box-seam-fill' },
        { name: 'People', icon: 'bi-people-fill' },
        { name: 'Calendar', icon: 'bi-calendar-check' },
        { name: 'Tags', icon: 'bi-tags-fill' }
      ];

      window.openIconPicker = function (idx) {
        if (!isEditMode) return;
        activeIconPickerTagIndex = idx;
        document.getElementById('iconPickerBackdrop').classList.add('show');
        document.getElementById('iconPickerModal').classList.add('show');
        document.getElementById('iconSearchInput').value = '';
        renderIconGrid(AVAILABLE_ICONS);
      };

      window.closeIconPicker = function () {
        document.getElementById('iconPickerBackdrop').classList.remove('show');
        document.getElementById('iconPickerModal').classList.remove('show');
        activeIconPickerTagIndex = null;
      };

      function renderIconGrid(list) {
        const grid = document.getElementById('iconGrid');
        grid.innerHTML = list.map(item => `
          <div class="icon-opt" onclick="selectIcon('${item.icon}')" title="${item.name}">
            <i class="bi ${item.icon}"></i>
            <span>${item.name}</span>
          </div>
        `).join('');
      }

      window.filterIconGrid = function (query) {
        const q = query.toLowerCase().trim();
        const filtered = AVAILABLE_ICONS.filter(i => i.name.toLowerCase().includes(q) || i.icon.toLowerCase().includes(q));
        renderIconGrid(filtered);
      };

      window.selectIcon = function (iconClass) {
        closeIconPicker();
      };

      // Verify token and reveal editor UI
      function startEditor() {
        fetch('/api/v1/auth/me', { headers: { 'Authorization': 'Bearer ' + token } })
          .then(res => {
            if (!res.ok) {
              localStorage.removeItem('omni_admin_token');
              localStorage.removeItem('omni_admin_user');
              if (window.top !== window.self) window.top.location.replace('admin/login.html');
              else window.location.replace('admin/login.html');
              return;
            }
            document.documentElement.classList.add('auth-ready');
          })
          .catch(() => {
            localStorage.removeItem('omni_admin_token');
            localStorage.removeItem('omni_admin_user');
            if (window.top !== window.self) window.top.location.replace('admin/login.html');
            else window.location.replace('admin/login.html');
          });
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', startEditor);
      } else {
        startEditor();
      }
    })();
  </script>
</body>

</html>
