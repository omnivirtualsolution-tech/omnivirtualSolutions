[build]
  command = "npm install --prefix frontend && npm run build"
  publish = "frontend/dist"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"
  included_files = ["backend/**", "assets/**"]

# 1. Assets for Admin In-Place Live Editor
[[redirects]]
  from = "/admin/site/assets/*"
  to = "/assets/:splat"
  status = 200

# 2. Admin In-Place Live Editor Pages
[[redirects]]
  from = "/admin/site/*"
  to = "/admin/site/:splat"
  status = 200

# 2b. Route uploaded media directly from Turso Cloud database
[[redirects]]
  from = "/assets/uploads/*"
  to = "/.netlify/functions/api/api/v1/cms/media/:splat"
  status = 200
  force = true

# 3. Route API requests to Netlify Serverless Function
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/api/:splat"
  status = 200
  force = true

# 4. Route Admin Portal
[[redirects]]
  from = "/admin"
  to = "/admin/index.html"
  status = 200

[[redirects]]
  from = "/admin/*"
  to = "/admin/:splat"
  status = 200

# 5. React SPA Fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
